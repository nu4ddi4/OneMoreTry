name: Godot Windows

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional matching tag: main v0.3.0, beta v0.3.0-beta'
        required: false
        type: string
      verified_run_id:
        description: 'Recovery only: successful Godot Windows run with identical shipped game inputs; reuse its Windows-tested artifacts'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # A manual retry must not wait behind an unresponsive push runner.
  group: game-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || inputs.verified_run_id || 'build' }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: Branch policy
    runs-on: ubuntu-latest
    steps:
      - name: Validate release target
        env:
          RELEASE_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          case "$RELEASE_BRANCH" in
            main|beta) ;;
            *) echo 'Expected main or beta as the build target.'; exit 1 ;;
          esac

  build:
    name: Test & export Windows
    needs: branch-policy
    if: github.event_name != 'workflow_dispatch' || inputs.verified_run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.6.3
        run: |
          curl --fail --location --retry 3 --output /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          sudo ln -s /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          python3 tools/fetch_templates.py
      - name: Validate release configuration and stamp runtime channel
        env:
          RELEASE_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          python3 tools/test_release_config.py
          python3 tools/release_config.py --branch "$RELEASE_BRANCH" --sha "$GITHUB_SHA" --stamp --output build/release-info.json
      - name: Import project
        run: godot --headless --editor --import --quit
      - name: Physics and save regression tests
        run: godot --headless --fixed-fps 120 --script tests/run_tests.gd -- --test
      - name: Resolution, UI bounds and dialog resize regression tests
        run: godot --headless --script tests/display_tests.gd -- --test
      - name: Inspection controls, flight, room travel and record isolation
        run: godot --headless --fixed-fps 120 --script tests/inspection_tests.gd -- --test
      - name: Forty encounter reset, pause and mechanic contracts
        run: godot --headless --fixed-fps 120 --script tests/course_tests.gd -- --test
      - name: Action-driven traps, landing feedback, chain control and migration
        run: godot --headless --fixed-fps 120 --script tests/gameplay_revision_tests.gd -- --test
      - name: Latch feedback and visible mechanism preparation
        run: godot --headless --fixed-fps 120 --script tests/fairness_tests.gd -- --test
      - name: Wrong-decision physical consequence in all forty encounters
        run: godot --headless --fixed-fps 120 --script tests/wrong_routes.gd -- --test
      - name: Continuous course traversal with normal inputs
        run: godot --headless --fixed-fps 120 --script tests/playthrough.gd -- --test
      - name: Replay identical physics at 30 fps with platform, chain and lift pauses
        run: godot --headless --fixed-fps 30 --script tests/replay.gd -- --test --pauses
      - name: Complete skill route through connected upper path and first ferry
        run: godot --headless --fixed-fps 120 --script tests/playthrough.gd -- --test --fast
      - name: Replay skill route at 30 fps with device pauses
        run: godot --headless --fixed-fps 30 --script tests/replay.gd -- --test --fast --pauses
      - name: Update metadata, real HTTP download, verification and cancellation
        run: python3 tools/test_updater.py
      - name: Export Windows x64
        run: |
          mkdir -p build/windows
          godot --headless --export-release 'Windows Desktop' build/windows/OneMoreTry.exe
          cp docs/PLAY_WINDOWS.txt build/windows/README.txt
          mkdir -p build/windows/licenses
          cp assets/fonts/LICENSE.txt build/windows/licenses/NotoSansCJK.txt
          cp docs/GODOT_LICENSE.txt build/windows/licenses/Godot.txt
          cp docs/GODOT_COPYRIGHT.txt build/windows/licenses/Godot-third-party.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OneMoreTry-Windows-x64
          path: build/windows/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: release-info
          path: build/release-info.json
          retention-days: 30

  windows-smoke:
    name: Windows launch
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: OneMoreTry-Windows-x64
          path: build/windows
      - uses: actions/download-artifact@v4
        with:
          name: release-info
          path: build
      - name: Build per-user Windows installer
        shell: pwsh
        run: |
          $info = Get-Content build/release-info.json -Raw | ConvertFrom-Json
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw 'Inno Setup 6 is required on this runner' }
          & $compiler "/DAppVersion=$($info.version)" "/DBaseVersion=$($info.base_version)" installer/OneMoreTry.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Install Windows package and preserve saved records
        timeout-minutes: 3
        shell: pwsh
        run: ./tools/test_installer.ps1 -Phase install
      - name: Launch installed game
        timeout-minutes: 2
        shell: pwsh
        run: ./tools/test_installer.ps1 -Phase launch-installed
      - name: Reinstall Windows package and preserve saved records
        timeout-minutes: 3
        shell: pwsh
        run: ./tools/test_installer.ps1 -Phase reinstall
      - name: Launch reinstalled game
        timeout-minutes: 2
        shell: pwsh
        run: ./tools/test_installer.ps1 -Phase launch-reinstalled
      - name: Uninstall Windows package and preserve saved records
        timeout-minutes: 3
        shell: pwsh
        run: ./tools/test_installer.ps1 -Phase uninstall
      - name: Launch the exported exe on native Windows
        shell: pwsh
        run: |
          foreach ($resolution in @('640x360', '3840x1080')) {
            $stdout = "native-$resolution-stdout.log"
            $stderr = "native-$resolution-stderr.log"
            $process = Start-Process -FilePath ./build/windows/OneMoreTry.exe -ArgumentList '--headless','--windowed','--resolution',$resolution,'--audio-driver','Dummy','--quit-after','120','--','--test' -PassThru -Wait -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            Get-Content $stdout
            Get-Content $stderr
            if ($process.ExitCode -ne 0) { throw "Game at $resolution exited with $($process.ExitCode)" }
            $errors = Select-String -Path $stdout,$stderr -Pattern 'SCRIPT ERROR|ERROR:'
            if ($errors) { throw "Godot reported runtime errors at ${resolution}: $errors" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: OneMoreTry-Windows-installer
          path: build/installer/*-Setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-launch-logs
          path: |
            native-*.log
            installer-*.log

  publish:
    name: Publish Windows release
    if: always() && needs.branch-policy.result == 'success' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && ((needs.build.result == 'success' && needs.windows-smoke.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.verified_run_id != ''))
    needs: [branch-policy, build, windows-smoke]
    runs-on: ubuntu-latest
    concurrency:
      group: windows-release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REQUESTED_TAG: ${{ inputs.release_tag }}
      VERIFIED_RUN_ID: ${{ inputs.verified_run_id }}
      RELEASE_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release request
        id: release
        run: |
          python3 tools/release_config.py --branch "$RELEASE_BRANCH" --sha "$GITHUB_SHA" --output /tmp/expected-release.json
          release_tag=$(jq -r .tag /tmp/expected-release.json)
          [[ -z "$REQUESTED_TAG" || "$REQUESTED_TAG" == "$release_tag" ]] || { echo 'Tag must match branch and project version'; exit 1; }
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "PRERELEASE=$(jq -r .prerelease /tmp/expected-release.json)" >> "$GITHUB_ENV"
          if [[ -n "$VERIFIED_RUN_ID" ]]; then
            [[ "$VERIFIED_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Expected a numeric verified run ID'; exit 1; }
            gh api "repos/$GH_REPO/actions/runs/$VERIFIED_RUN_ID" > /tmp/verified-run.json
            # A recovery commit may change publishing automation only. Require the
            # verified commit to be an ancestor and the shipped game inputs identical.
            verified_sha=$(jq -r .head_sha /tmp/verified-run.json)
            jq -e '.name == "Godot Windows" and .path == ".github/workflows/game-ci.yml" and .status == "completed" and .conclusion == "success" and (.event == "push" or .event == "workflow_dispatch")' /tmp/verified-run.json
            git fetch origin "$verified_sha" --depth=1
            git diff --exit-code "$verified_sha" HEAD -- project.godot export_presets.cfg scripts scenes assets installer docs/PLAY_WINDOWS.txt docs/GODOT_LICENSE.txt docs/GODOT_COPYRIGHT.txt
            gh api "repos/$GH_REPO/compare/$verified_sha...$GITHUB_SHA" --jq .status | grep -Ex 'ahead|identical'
            gh api "repos/$GH_REPO/actions/runs/$VERIFIED_RUN_ID/jobs?per_page=100" > /tmp/verified-jobs.json
            jq -e '[.jobs[] | select((.name == "Test & export Windows" or .name == "Windows launch") and .conclusion == "success")] | length == 2' /tmp/verified-jobs.json
            echo "ARTIFACT_SOURCE_SHA=$verified_sha" >> "$GITHUB_ENV"
            echo "ARTIFACT_RUN_ID=$VERIFIED_RUN_ID" >> "$GITHUB_ENV"
          else
            echo "ARTIFACT_SOURCE_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
            echo "ARTIFACT_RUN_ID=$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          fi
          # A missing release is distinct from an authentication or server failure.
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" | jq 'add' > /tmp/releases.json
          if jq -e --arg tag "$release_tag" '.[] | select(.tag_name == $tag and .draft == false)' /tmp/releases.json >/dev/null; then
            echo 'Published version exists; leave it untouched.'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.release.outputs.publish == 'true'
        with:
          name: release-info
          path: build
          run-id: ${{ env.ARTIFACT_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Verify artifact version, channel and source commit
        if: steps.release.outputs.publish == 'true'
        run: python3 tools/release_config.py --branch "$RELEASE_BRANCH" --sha "$GITHUB_SHA" --verify build/release-info.json --artifact-sha "$ARTIFACT_SOURCE_SHA"
      - uses: actions/download-artifact@v4
        if: steps.release.outputs.publish == 'true'
        with:
          name: OneMoreTry-Windows-x64
          path: package
          run-id: ${{ env.ARTIFACT_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: steps.release.outputs.publish == 'true'
        with:
          name: OneMoreTry-Windows-installer
          path: release
          run-id: ${{ env.ARTIFACT_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Package the Windows-tested executable
        if: steps.release.outputs.publish == 'true'
        working-directory: package
        run: |
          zip -r -9 "../release/OneMoreTry-${RELEASE_TAG}-Windows-x64.zip" .
          cd ../release
          sha256sum "OneMoreTry-${RELEASE_TAG}-Windows-x64.zip" > "OneMoreTry-${RELEASE_TAG}-Windows-x64.zip.sha256"
          sha256sum "OneMoreTry-${RELEASE_TAG}-Windows-x64-Setup.exe" > "OneMoreTry-${RELEASE_TAG}-Windows-x64-Setup.exe.sha256"
      - name: Upload and publish the selected channel
        if: steps.release.outputs.publish == 'true'
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG — 한 번만 더!" --notes-file docs/RELEASE_NOTES.md
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG — 한 번만 더!" --notes-file docs/RELEASE_NOTES.md --draft
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          # The updater requires GitHub's asset digest; never publish an unusable feed.
          release_api=$(gh release view "$RELEASE_TAG" --json apiUrl --jq .apiUrl)
          gh api "$release_api" > /tmp/uploaded-release.json
          jq -e --arg name "OneMoreTry-${RELEASE_TAG}-Windows-x64-Setup.exe" '.assets[] | select(.name == $name and (.digest | test("^sha256:[0-9a-f]{64}$")))' /tmp/uploaded-release.json
          if [[ "$PRERELEASE" == true ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=true --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
