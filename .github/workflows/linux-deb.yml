name: Linux DEB and APT

on:
  pull_request:
    paths:
      - '.github/workflows/linux-deb.yml'
      - 'installer/linux/**'
      - 'tools/build_deb.py'
      - 'tools/build_apt_repository.py'
      - 'tools/fetch_templates.py'
      - 'project.godot'
      - 'export_presets.cfg'
  push:
    branches: [main]
    paths:
      - 'installer/linux/debian-revision'
      - 'project.godot'
      - '.github/workflows/linux-deb.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-deb-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and Linux templates
        run: |
          curl --fail --location --retry 3 --output /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          sudo ln -s /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          python3 tools/fetch_templates.py --platform linux
      - name: Build the Debian package
        id: package
        run: |
          python3 tools/release_config.py --branch main --sha "$GITHUB_SHA" --output build/release-info.json
          version="$(jq -er '.version' build/release-info.json)"
          revision="$(cat installer/linux/debian-revision)"
          [[ "$revision" =~ ^[1-9][0-9]*$ ]]
          deb_version="$version-$revision"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            deb_version="$version~preview+git.${GITHUB_SHA:0:7}-$revision"
          fi
          mkdir -p build/linux
          godot --headless --editor --import --quit
          godot --headless --export-release 'Linux x86_64' build/linux/onemoretry
          python3 tools/build_deb.py --binary build/linux/onemoretry --version "$deb_version"
          echo "version=$deb_version" >> "$GITHUB_OUTPUT"
      - name: Verify signed APT install and start exported game
        env:
          DEB_VERSION: ${{ steps.package.outputs.version }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/apt-verification-key"
          install -d -m 700 "$GNUPGHOME"
          trap 'gpgconf --kill all; rm -rf "$GNUPGHOME"' EXIT
          gpg --batch --passphrase '' --quick-generate-key 'OneMoreTry CI <ci@example.invalid>' ed25519 sign 1d
          fingerprint="$(gpg --with-colons --list-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          repo="$RUNNER_TEMP/apt-verification-repository"
          python3 tools/build_apt_repository.py --deb "build/deb/onemoretry_${DEB_VERSION}_amd64.deb" --output "$repo" --fingerprint "$fingerprint"
          sudo install -D -m 644 "$repo/onemoretry-archive-keyring.asc" /etc/apt/keyrings/onemoretry-ci.asc
          source_file=/etc/apt/sources.list.d/onemoretry-ci.list
          printf 'deb [arch=amd64 signed-by=/etc/apt/keyrings/onemoretry-ci.asc] file:%s stable main\n' "$repo" | sudo tee "$source_file"
          sudo apt-get update -o "Dir::Etc::sourcelist=$source_file" -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0
          sudo apt-get install -y "onemoretry=$DEB_VERSION"
          cmp installer/linux/onemoretry.list /etc/apt/sources.list.d/onemoretry.list
          cmp installer/linux/onemoretry.asc /etc/apt/keyrings/onemoretry.asc
          test "$(dpkg-query -W -f='${Version}' onemoretry)" = "$DEB_VERSION"
          XDG_DATA_HOME="$(mktemp -d)" timeout 30s onemoretry --headless --quit-after 10 -- --test
      - uses: actions/upload-artifact@v4
        with:
          name: OneMoreTry-Linux-amd64
          path: build/deb/*.deb
          if-no-files-found: error

  publish:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.APT_SIGNING_FINGERPRINT != '' }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
      - name: Compare installed repository version
        id: version
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          DEB_VERSION: ${{ needs.package.outputs.version }}
        run: |
          status="$(curl --silent --show-error --location --retry 3 --max-time 20 --output /tmp/omt-apt-version --write-out '%{http_code}' "${BASE_URL%/}/apt/version.txt")"
          case "$status" in
            200)
              current="$(cat /tmp/omt-apt-version)"
              dpkg --validate-version "$current"
              if dpkg --compare-versions "$DEB_VERSION" eq "$current"; then
                echo "The Debian package version is already published."
                echo 'publish=false' >> "$GITHUB_OUTPUT"
                exit 0
              fi
              dpkg --compare-versions "$DEB_VERSION" gt "$current"
              ;;
            404) ;;
            *) echo "Unable to read the existing repository version (HTTP $status)."; exit 1 ;;
          esac
          echo 'publish=true' >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.publish == 'true'
        with:
          name: OneMoreTry-Linux-amd64
          path: packages
      - name: Sign the APT repository
        if: steps.version.outputs.publish == 'true'
        env:
          DEB_VERSION: ${{ needs.package.outputs.version }}
          APT_SIGNING_FINGERPRINT: ${{ vars.APT_SIGNING_FINGERPRINT }}
          APT_SIGNING_SUBKEY: ${{ secrets.APT_SIGNING_SUBKEY }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
        run: |
          : "${APT_SIGNING_SUBKEY:?Configure the APT signing subkey in the github-pages environment}"
          export GNUPGHOME="$RUNNER_TEMP/onemoretry-apt-gnupg"
          install -d -m 700 "$GNUPGHOME"
          trap 'gpgconf --kill all; rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$APT_SIGNING_SUBKEY" | gpg --batch --import
          unset APT_SIGNING_SUBKEY
          python3 tools/build_apt_repository.py --deb "packages/onemoretry_${DEB_VERSION}_amd64.deb" --output site/apt --fingerprint "$APT_SIGNING_FINGERPRINT"
          printf '%s\n' "$DEB_VERSION" > site/apt/version.txt
          cp installer/Install-OneMoreTry.ps1 site/apt/
      - uses: actions/upload-pages-artifact@v3
        if: steps.version.outputs.publish == 'true'
        with:
          path: site
      - uses: actions/deploy-pages@v4
        if: steps.version.outputs.publish == 'true'
        id: deployment
